<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدول هواشناسی — تم سیاه</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Tahoma, "Vazirmatn", sans-serif;
    background: #0f1115; color: #e6e8ee;
    margin: 0; padding: 20px; min-height: 100vh;
  }
  h1 { font-size: 18px; margin: 0 0 6px; color: #9fb8ff; }
  .sub { font-size: 12px; color: #7d8598; margin-bottom: 14px; }
  .sub code { background: #1a1e28; padding: 2px 6px; border-radius: 4px; color: #b8c4e0; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: center; }
  .toolbar input[type="search"] {
    padding: 9px 12px; border: 1px solid #2a3040; border-radius: 8px;
    min-width: 220px; font-family: inherit; background: #161b24; color: #e6e8ee;
  }
  .toolbar input[type="search"]:focus { outline: none; border-color: #4a6bbf; }
  .toolbar button {
    padding: 9px 14px; border: none; border-radius: 8px;
    background: #2f4a8a; color: #fff; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  .toolbar button:hover { background: #3d5ba8; }
  .toolbar button.secondary { background: #232a38; color: #c8d2e6; }

  .status { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .status.success { display: block; background: #14261a; color: #8fe0a3; border: 1px solid #1e4a2a; }

  .legend {
    background: #161b24; border: 1px solid #2a3040; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; font-size: 12px; color: #b8c4e0;
  }
  .legend .bar { width: 260px; height: 16px; border-radius: 8px; border: 1px solid #2a3040; background: linear-gradient(to left, #d32f2f, #f57c00, #fbc02d, #388e3c, #1976d2, #283593, #4a148c); }
  .legend .min { color: #b39ddb; font-weight: 600; }
  .legend .max { color: #ef5350; font-weight: 600; }

  .table-wrap { overflow: auto; max-height: 70vh; border: 1px solid #2a3040; border-radius: 10px; background: #131720; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: #1c2230; color: #c8d2e6;
    padding: 10px 12px; text-align: center; font-weight: 600; cursor: pointer; border-bottom: 2px solid #2f4a8a;
  }
  thead th .arrow { font-size: 10px; margin-right: 4px; opacity: .5; }
  thead th .range { display: block; font-size: 10px; font-weight: 400; opacity: .7; margin-top: 3px; color: #9fb8ff; }

  tbody td { padding: 7px 12px; text-align: center; border-bottom: 1px solid #1e2330; color: #d4dae6; }
  tbody tr:nth-child(even) { background: #151a24; }
  tbody tr:hover { background: #1e2636; }
  tbody td.rtl { direction: rtl; text-align: right; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.yes { background: #1e4a2a; color: #8fe0a3; }
  .badge.no  { background: #232a38; color: #7d8598; }
  .num { font-variant-numeric: tabular-nums; }
  .null { color: #4a5266; font-style: italic; }
  .empty { padding: 30px; text-align: center; color: #5c6579; }
  .count { font-size: 12px; color: #7d8598; margin-bottom: 8px; }
</style>
</head>
<body>

<h1>جدول داده‌های هواشناسی — تم سیاه</h1>
<div class="sub">منبع: دیتای داخلی (بدون نیاز به اینترنت)</div>

<div class="toolbar">
  <input type="search" id="searchBox" placeholder="جستجو در همه ردیف‌ها…">
</div>

<div class="legend">
  <div class="group">
    <span class="min">حداقل</span> <span class="bar"></span> <span class="max">حداکثر</span>
  </div>
  <div>بازهٔ هر ستون خودکار از داده‌ها محاسبه می‌شود.</div>
</div>

<div class="status" id="status"></div>
<div class="count" id="rowCount">در حال بارگذاری…</div>

<div class="table-wrap">
  <table id="dataTable">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<script>
// دیتای نمونه (می‌توانید این آرایه را با کل دیتای ۷۵۰ ردیفی جایگزین کنید)
const rawData = [
  { "t": "17.1", "rrr24": "0.0", "rrr6": "0.0", "local_province": "اصفهان", "station": "پالایشگاه اصفهان", "province": "Esfahan", "lat": 32.774, "lon": 51.507, "t_min": "12.2", "t_max": "25.0", "is_center": false, "wmo_code": "19267", "data_time": "2026-10-24 01:30:00" },
  { "t": "22.0", "rrr24": "0.0", "rrr6": "0.0", "local_province": "سیستان و بلوچستان", "station": "هامون", "province": "Sistan Va Baluchestan", "lat": 30.85, "lon": 61.45, "t_min": "15.0", "t_max": "29.0", "is_center": false, "wmo_code": "19574", "data_time": "2026-10-24 01:30:00" },
  { "t": "17.3", "rrr24": "0.0", "rrr6": "0.0", "local_province": "خراسان شمالی", "station": "مهمانک", "province": "North Khorasan", "lat": 37.51, "lon": 56.86, "t_min": "11.0", "t_max": "23.0", "is_center": false, "wmo_code": "18153", "data_time": "2026-10-24 01:30:00" },
  { "t": "13.8", "rrr24": "0.0", "rrr6": "0.0", "local_province": "کردستان", "station": "اَویهنگ", "province": "Kordestan", "lat": 35.25, "lon": 46.68, "t_min": "8.3", "t_max": "21.5", "is_center": false, "wmo_code": "18840", "data_time": "2026-10-24 01:30:00" },
  { "t": "18.7", "rrr24": "0.0", "rrr6": "0.0", "local_province": "سیستان و بلوچستان", "station": "تمندان", "province": "Sistan Va Baluchestan", "lat": 28.57, "lon": 61.013, "t_min": "14.2", "t_max": "23.5", "is_center": false, "wmo_code": "18042", "data_time": "2026-10-24 01:30:00" }
];

const COLUMNS = [
  { key: "station",        label: "ایستگاه",       type: "text", rtl: true },
  { key: "local_province", label: "استان (فارسی)", type: "text", rtl: true },
  { key: "t",              label: "دما (°C)",      type: "num", heat: true },
  { key: "t_min",          label: "حداقل دما",     type: "num", heat: true },
  { key: "t_max",          label: "حداکثر دما",    type: "num", heat: true },
  { key: "rrr24",          label: "بارش ۲۴س",      type: "num", heat: true },
  { key: "lat",            label: "عرض جغرافیایی", type: "num", heat: true },
  { key: "lon",            label: "طول جغرافیایی", type: "num", heat: true }
];

const COLOR_STOPS = ["#4a148c", "#283593", "#1976d2", "#388e3c", "#fbc02d", "#f57c00", "#d32f2f"];

function hexToRgb(hex) {
  hex = hex.replace("#", ""); if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
  return { r: parseInt(hex.substr(0, 2), 16), g: parseInt(hex.substr(2, 2), 16), b: parseInt(hex.substr(4, 2), 16) };
}
function rgbToHex({ r, g, b }) { const h = n => n.toString(16).padStart(2, "0"); return "#" + h(r) + h(g) + h(b); }
function lerpColor(c1, c2, t) { const a = hexToRgb(c1), b = hexToRgb(c2); return rgbToHex({ r: Math.round(a.r + (b.r - a.r) * t), g: Math.round(a.g + (b.g - a.g) * t), b: Math.round(a.b + (b.b - a.b) * t) }); }
function colorFromRatio(ratio) { ratio = Math.max(0, Math.min(1, ratio)); const n = COLOR_STOPS.length - 1; const seg = ratio * n; const i = Math.min(Math.floor(seg), n - 1); const t = seg - i; return lerpColor(COLOR_STOPS[i], COLOR_STOPS[i + 1], t); }
function contrastText(hexBg) { const { r, g, b } = hexToRgb(hexBg); const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255; return lum > 0.65 ? "#111" : "#fff"; }

function computeRanges(rows) {
  const ranges = {};
  for (const c of COLUMNS) {
    if (c.type !== "num") continue;
    let min = Infinity, max = -Infinity, count = 0;
    for (const row of rows) {
      const v = row[c.key]; if (v === null || v === undefined || v === "") continue;
      const n = Number(v); if (isNaN(n)) continue;
      if (n < min) min = n; if (n > max) max = n; count++;
    }
    ranges[c.key] = count > 0 ? { min, max, valid: min !== max } : { min: 0, max: 1, valid: false };
  }
  return ranges;
}

let RANGES = computeRanges(rawData);
const state = { sortKey: null, sortDir: 1, search: "" };
const tbody = document.querySelector("#dataTable tbody");
const thead = document.querySelector("#dataTable thead");
const rowCountEl = document.getElementById("rowCount");

function fmtNumber(n) { return Number.isInteger(n) ? n.toString() : parseFloat(n.toFixed(2)).toString(); }
function fmtCell(value, col) {
  if (value === null || value === undefined || value === "") return { html: `<span class="null">—</span>`, style: "" };
  if (col.type === "bool") return { html: value ? `<span class="badge yes">بله</span>` : `<span class="badge no">خیر</span>`, style: "" };
  if (col.type === "num") {
    const n = Number(value);
    if (!isNaN(n)) {
      let style = "";
      if (col.heat && RANGES[col.key]) {
        const { min, max, valid } = RANGES[col.key];
        const ratio = valid ? (n - min) / (max - min) : 0.5;
        const bg = colorFromRatio(ratio); const fg = contrastText(bg);
        style = `background:${bg};color:${fg};font-weight:600;`;
      }
      return { html: `<span class="num">${fmtNumber(n)}</span>`, style };
    }
  }
  return { html: String(value), style: "" };
}

function renderHead() {
  let html = "<tr>";
  COLUMNS.forEach(c => {
    const sorted = state.sortKey === c.key;
    const cls = sorted ? (state.sortDir === 1 ? "sorted-asc" : "sorted-desc") : "";
    const arrow = sorted ? (state.sortDir === 1 ? "▲" : "▼") : "⇅";
    let rangeInfo = "";
    if (c.type === "num" && RANGES[c.key]) {
      const { min, max } = RANGES[c.key];
      rangeInfo = `<span class="range">${fmtNumber(min)} ← ${fmtNumber(max)}</span>`;
    }
    html += `<th class="${cls}" data-key="${c.key}"><span class="arrow">${arrow}</span>${c.label}${rangeInfo}</th>`;
  });
  html += "</tr>";
  thead.innerHTML = html;
  thead.querySelectorAll("th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (state.sortKey === key) state.sortDir *= -1; else { state.sortKey = key; state.sortDir = 1; }
      render();
    });
  });
}

function render() {
  let rows = rawData.filter(row => {
    if (!state.search) return true;
    const q = state.search.toLowerCase();
    return COLUMNS.some(c => { const v = row[c.key]; return v !== null && v !== undefined && String(v).toLowerCase().includes(q); });
  });

  if (state.sortKey) {
    const col = COLUMNS.find(c => c.key === state.sortKey);
    rows = rows.slice().sort((a, b) => {
      const va = a[state.sortKey], vb = b[state.sortKey];
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      let cmp; if (col.type === "num") cmp = Number(va) - Number(vb); else cmp = String(va).localeCompare(String(vb), "fa");
      return cmp * state.sortDir;
    });
  }

  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${COLUMNS.length}" class="empty">موردی یافت نشد</td></tr>`;
  } else {
    const parts = [];
    for (const row of rows) {
      parts.push("<tr>");
      for (const c of COLUMNS) {
        const cls = c.rtl ? "rtl" : "";
        const { html, style } = fmtCell(row[c.key], c);
        parts.push(`<td class="${cls}"${style ? ` style="${style}"` : ""}>${html}</td>`);
      }
      parts.push("</tr>");
    }
    tbody.innerHTML = parts.join("");
  }
  rowCountEl.textContent = `نمایش ${rows.length} از ${rawData.length} رکورد` + (state.search ? " (فیلترشده)" : "");
}

document.getElementById("searchBox").addEventListener("input", e => { state.search = e.target.value.trim(); render(); });

renderHead();
render();
</script>
</body>
</html>
